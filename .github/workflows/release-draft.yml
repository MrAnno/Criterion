name: Release draft

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  tarball:
    name: "Source tarball"
    if: (github.event_name == 'workflow_dispatch') ||
        (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'version-bump'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out Criterion
        uses: actions/checkout@v2
      - name: Install dist dependencies
        run: sudo apt-get update && sudo apt-get install -y meson libffi-dev
      - name: Create source tarball
        run: meson setup build && meson dist -C build --include-subprojects --formats xztar
      - name: Upload artifacts
        uses: actions/upload-artifact@v2
        with:
          name: source-tarball
          path: build/meson-dist/criterion-*.tar.xz
          retention-days: 14
          if-no-files-found: error

  binaries:
    name: "Binaries"
    runs-on: ubuntu-latest
    # glibc v2.17 builder
    container: centos:7
    needs: [tarball]

    steps:
      - name: Install build dependencies
        run: |
          yum update -y
          yum install -y epel-release centos-release-scl
          yum install -y meson ninja-build cmake3 libffi-devel pkgconfig gcc gcc-c++
          ln -s /usr/bin/cmake3 /usr/bin/cmake
      - name: Download source tarball
        uses: actions/download-artifact@v2
        with:
          name: source-tarball
      - name: Detect version
        run: |
          version="$(ls criterion-*.tar.xz | sed -E "s|criterion-(.+)\.tar\.xz|\1|")"
          echo "version=${version}" >> $GITHUB_ENV
      - name: Extract source tarball
        run: |
          tar -xf "criterion-${version}.tar.xz" && rm "criterion-${version}.tar.xz"
      - name: Build Criterion
        # install: --skip-subprojects requires meson >=0.58
        run: |
          meson setup --prefix /usr --libdir lib --buildtype plain --wrap-mode nodownload build "criterion-${version}"
          meson compile -C build
          DESTDIR="$(realpath .)/binaries/criterion-${version}" meson install -C build
      - name: Create binary tarball
        run: tar --create --xz --file "criterion-${version}-linux-x86_64.tar.xz" -C binaries "criterion-${version}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v2
        with:
          name: binaries
          path: binaries/criterion-*.tar.xz
          retention-days: 14
          if-no-files-found: error

  release-draft:
    name: "Release draft"
    runs-on: ubuntu-latest
    needs: [tarball, binaries]

    steps:
      - name: Check out Criterion
        uses: actions/checkout@v2
      - name: Download source tarball
        uses: actions/download-artifact@v2
        with:
          name: source-tarball
      - name: Detect version
        run: |
          version="$(ls criterion-*.tar.xz | sed -E "s|criterion-(.+)\.tar\.xz|\1|")"
          echo "version=${version}" >> $GITHUB_ENV
      - name: Download binaries
        uses: actions/download-artifact@v2
        with:
          name: binaries
      - name: Create release draft
        run: gh release create --draft --target master "v${version}" criterion-*.tar.xz
